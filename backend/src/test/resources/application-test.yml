spring:
  ai:
    model:
      embedding: none
  datasource:
    url: jdbc:h2:mem:ysn_university_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true

management:
  health:
    redis:
      enabled: false

app:
  ai:
    retrieval:
      semantic-enabled: false
